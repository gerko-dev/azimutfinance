# Scrape le Bulletin Officiel de la Cote (BOC) BRVM pour rafraichir les
# valeurs nominales courantes des obligations cotees, puis commit + push.
#
# Cron : 3 passes les jours ouvres :
#   - 08h00 UTC : rattrapage matinal au cas ou le BOC du jour J-1 a ete
#     republie tardivement la veille
#   - 18h00 UTC : premiere tentative apres publication BRVM (souvent dispo)
#   - 20h00 UTC : deuxieme tentative pour les jours ou le BOC est publie tard
# Egalement declenchable manuellement depuis l'UI GitHub Actions.
#
# Le scraper :
#   1. Tente https://bfin.brvm.org/boc/BOC_JOUR/BOC_YYYYMMDD.pdf
#   2. Sinon https://bfin.brvm.org/boc/BOC_JOUR/BOC_YYYYMMDD_2.pdf
#   3. Si rien dispo aujourd'hui (jour ferie, retard de publication...),
#      remonte jusqu'a 10 jours en arriere pour trouver le dernier BOC.
#
# Sortie :
#   - data/obligations-cotees-vn-boc.csv (audit VN par mnemonique)
#   - data/obligations-cotees-boc-synthese.json (KPIs marche : capitalisation,
#     volume echange, valeur transigee de la page 1 du BOC)
#   - data/fcp.csv (tableau FCP / SICAV extrait de la derniere page du BOC)
#   - data/obligations-cotees.csv (injection des VN dans nominalValue, --merge)

name: Scrape BOC BRVM

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYYMMDD a scraper. Vide = auto-detect dernier dispo."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-boc
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypdf

      - name: Scrape BOC
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/scrape_brvm_boc.py "${{ inputs.date }}" --merge
          else
            python scripts/scrape_brvm_boc.py --merge
          fi

      - name: Show diff stats
        run: |
          echo "=== Files modified ==="
          git status --short data/obligations-cotees.csv data/obligations-cotees-vn-boc.csv data/obligations-cotees-boc-synthese.json data/fcp.csv data/obligations-cotees-prix.csv data/obligations-cotees-boc-statut.csv || true
          echo ""
          echo "=== Diff summary ==="
          git diff --stat data/obligations-cotees.csv data/obligations-cotees-vn-boc.csv data/obligations-cotees-boc-synthese.json data/fcp.csv data/obligations-cotees-prix.csv data/obligations-cotees-boc-statut.csv || true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obligations-cotees.csv data/obligations-cotees-vn-boc.csv data/obligations-cotees-boc-synthese.json data/fcp.csv data/obligations-cotees-prix.csv data/obligations-cotees-boc-statut.csv
          if git diff --staged --quiet; then
            echo "Aucun changement a commiter."
            exit 0
          fi
          DATE_TAG=$(date -u +%Y-%m-%d)
          git commit \
            -m "chore(data): refresh VN + volumes obligations cotees BRVM ${DATE_TAG}" \
            -m "Mise a jour automatique via GitHub Actions (workflow scrape-boc)." \
            -m "Source : Bulletin Officiel de la Cote BRVM (bfin.brvm.org)."
          # Retry pour gerer les pushs concurrents (eviter conflits avec
          # scrape-sika ou autres commits sur main).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && {
              echo "Push effectue avec succes (essai $i)."
              exit 0
            }
            echo "Essai $i echoue, nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Push definitivement echoue apres 5 essais."
          exit 1
