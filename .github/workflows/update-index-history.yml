# Alimente l'historique des indices BRVM depuis la cote live, apres la
# cloture de la seance, puis commit + push. Vercel redeploiera en cascade.
#
# Pourquoi ce workflow : Sikafinance ne publie pas l'indice
# BRVM - SERVICES PUBLICS (teste sous 10 variantes de ticker, toutes en
# "nodata"). Sa serie s'arretait au 29/01/2025, et le YTD affiche sur
# /marches/actions etait calcule contre cette reference perimee — +185,89 %
# la ou la BRVM publie +168,89 %. L'historique 02/01/2025 -> 21/08/2026 a ete
# reconstitue depuis les Bulletins Officiels de la Cote
# (scripts/scrape_boc_indices.py, conserve pour le backfill et l'audit) ;
# au quotidien la cote live suffit.
#
# Cron : 2 passes les jours ouvres.
#   - 15h30 UTC : cloture BRVM (Abidjan = UTC). GitHub Actions decale
#     souvent de 5 a 15 minutes, ce qui laisse le temps a la BRVM de figer
#     la cloture.
#   - 17h00 UTC : passe de confirmation. Le script est idempotent : si la
#     valeur de 15h30 etait provisoire, cette passe la corrige ; sinon elle
#     ne produit aucun diff.
#
# Sortie : data/historique_sika_indices/BRVM-SP.csv

name: Historique indices BRVM (cote live)

on:
  schedule:
    - cron: "30 15 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      codes:
        description: "Codes a ecrire, espace-separe. Vide = BRVM-SP. 'all' = tous."
        required: false
        default: ""
      date:
        description: "Date AAAA-MM-JJ a ecrire. Vide = aujourd'hui UTC."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-index-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Mise a jour depuis la cote live BRVM
        run: |
          ARGS=""
          if [ -n "${{ inputs.codes }}" ]; then
            ARGS="$ARGS --codes ${{ inputs.codes }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          python scripts/update_index_history_live.py $ARGS

      - name: Show diff stats
        run: |
          echo "=== Files modified ==="
          git status --short data/historique_sika_indices || true
          echo ""
          echo "=== Diff summary ==="
          git diff --stat data/historique_sika_indices || true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historique_sika_indices
          if git diff --staged --quiet; then
            echo "Aucun changement a commiter."
            exit 0
          fi
          DATE_TAG=$(date -u +%Y-%m-%d)
          git commit \
            -m "chore(data): refresh historique indices BRVM ${DATE_TAG}" \
            -m "Mise a jour automatique via GitHub Actions (workflow update-index-history)." \
            -m "Source : cote live BRVM (brvm.org/fr/indices), apres cloture."
          # Retry pour gerer les pushs concurrents (scrape-sika tourne a 16h,
          # scrape-boc a 18h).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && {
              echo "Push effectue avec succes (essai $i)."
              exit 0
            }
            echo "Essai $i echoue, nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Push definitivement echoue apres 5 essais."
          exit 1
